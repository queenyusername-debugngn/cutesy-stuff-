#====================================
#KITTY // TOXIC OVERLOAD:3
#====================================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
#-----

window_padding_width 14
window_margin_width 5
window_border_width 2

placement_strategy center

#----Cursor for vladih----

cursor_shape block
cursor_blink_interval 0.67
cursor_stop_blinking_after 15

#----behavior

enable_audio_bell no
confirm_os_window_close 0
scrollback_lines 10000
repaint_delay 8

#---Tab bar

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
tab_title_template "⋆‧°𓏲ּ𝄢⋆˚꩜｡ {index}: {title}~"
active_tab_foreground #088080
active_tab_background #FFB6C1
active_tab_font_style bold

inactive_tab_foreground #ff00a8
inactive_tab_background #151515
inactive_tab_font_style normal


#---window borders

active_border_color #39ff14
inactive_border_color #40102f
bell_border_color #ff00a8

#--#Main colors
# Background
background #211521
foreground #FFEAF3

# Cursor
cursor #FF8FB8
cursor_text_color #211521

# Selection
selection_background #FFB6C1
selection_foreground #211521

# ANSI colors
color0  #211521
color1  #FF8FB8
color2  #F4A6C8
color3  #FFD1DC
color4  #DDA0DD
color5  #FF69B4
color6  #E6B8D7
color7  #FFF0F5

# Bright ANSI colors
color8  #8F647F
color9  #FF5C9D
color10 #FF82AC
color11 #FFD1DC
color12 #D98BB8
color13 #C77DCE
color14 #F2A6CA
color15 #FFFFFF
foreground #c5ffc0
background #080b08

url_color #ff00a8


# ----- KEYBINDINGS -----

# Font resizing
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# New tab
map ctrl+shift+t new_tab

# Close tab
map ctrl+shift+w close_tab
allow_remote_control yes
